name: Repair Telemetry Validator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-telemetry-validator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Repair workflow regex escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/site-optimize.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("r'<script\\\\b[^>]*\\\\bsrc=[\"\\\\\\\']/assets/", "r'<script\\b[^>]*\\bsrc=[\"\\\']/assets/")
          s=s.replace("r'(?:\\\\?[^\"\\\\\\\']*)?[\"\\\\\\\'][^>]*>\\\\s*</script>'", "r'(?:\\?[^\"\\\']*)?[\"\\\'][^>]*>\\s*</script>'")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/site-optimize.yml
          git rm .github/workflows/repair-telemetry-validator.yml
          git commit -m 'fix: correct telemetry workflow regex escaping'
          git push origin HEAD:main
