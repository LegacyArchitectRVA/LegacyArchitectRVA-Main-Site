name: Sync JIC Plan payment link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Sync active JIC checkout link
        env:
          JIC_CHECKOUT_URL: https://buy.stripe.com/aFafZhavZcCIe7qbI96Zy01
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          url = os.environ["JIC_CHECKOUT_URL"]
          root = Path("legacy-site-REPO-READY")
          changed = []
          pattern = re.compile(r"https://buy\\.stripe\\.com/[^\"'<>\\s]+")

          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              original = text

              def repl(match):
                  start = max(0, match.start() - 1500)
                  end = min(len(text), match.end() + 1500)
                  context = text[start:end].lower()
                  if any(term in context for term in ("just-in-case", "just in case", "jic plan", "jicplan", "$29")):
                      return url
                  return match.group(0)

              text = pattern.sub(repl, text)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print("Changed:", changed)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No JIC checkout changes needed."
          else
            git commit -m "fix: wire JIC Plan checkout to active Stripe link"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              git reset --hard origin/main
              echo "A newer main commit already contains the current site changes; skipping this sync commit."
              exit 0
            fi
            git push origin HEAD:main
          fi
