name: Center Resources free tools

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center Readiness Check and Handoff cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('legacy-site-REPO-READY/resources.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Center Resources free tools */'
          if marker not in s:
              css = '''\n/* Center Resources free tools */\n@media(min-width:821px){\n  .path-steps{\n    grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n    max-width:940px !important;\n    margin-left:auto !important;\n    margin-right:auto !important;\n  }\n}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-site-REPO-READY/resources.html .github/workflows/center-resources-free-tools.yml
          git commit -m "Center Resources Readiness Check and Handoff" || exit 0
          git rm .github/workflows/center-resources-free-tools.yml
          git commit -m "Remove one-time Resources layout workflow"
          git push
