name: Site content fixes

on:
  push:
    paths:
      - '.site-content-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply production content corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('legacy-site-REPO-READY')
          index = root / 'index.html'

          # Keep the existing homepage section ordering correction.
          s = index.read_text(encoding='utf-8')
          marker = re.search(r"this\s+is\s+who\s+it['’]?s\s+all\s+for", s, re.I)
          if not marker:
              marker = re.search(r"this\s+is\s+who\s+it['’]?s\s+for", s, re.I)
          if marker:
              start = s.rfind('<section', 0, marker.start())
              end_tag = s.find('</section>', marker.end())
              if start >= 0 and end_tag >= 0:
                  end = end_tag + len('</section>')
                  block = s[start:end]
                  without = s[:start] + s[end:]
                  review = re.search(r"<section[^>]*>.*?(?:Let your Legacy echo|reviews|testimonials|what people say).*?</section>", without, re.I | re.S)
                  if review:
                      s = without[:review.start()] + block + '\n' + without[review.start():]

          # Keep the current seven-pillar terminology.
          replacements = {
              'Digital Life, Financial & Assets, Household & Property, Health & Medical, Legal & Estate, Business Continuity, and Legacy & Wishes':
              'Digital Life, Emergency & Successor Access, Financial & Assets, Household Operations, Vital Records, Legacy & Wishes, and Business Continuity',
              'Digital, financial, household, medical, legal, business, and legacy':
              'Digital Life, Emergency & Successor Access, Financial & Assets, Household Operations, Vital Records, Legacy & Wishes, and Business Continuity',
              'digital, financial, household, medical, legal, business, and legacy':
              'Digital Life, Emergency & Successor Access, Financial & Assets, Household Operations, Vital Records, Legacy & Wishes, and Business Continuity',
          }
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  page.write_text(text, encoding='utf-8')

          # Keep footer links to the two search-intent guides.
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if page.name in {'what-happens-when-you-die.html','digital-life-after-death.html'}:
                  continue
              additions = ''
              if 'href="/what-happens-when-you-die"' not in text:
                  additions += '<a href="/what-happens-when-you-die">What Happens After Death</a>'
              if 'href="/digital-life-after-death"' not in text:
                  additions += '<a href="/digital-life-after-death">Digital Life After Death</a>'
              if additions:
                  m = re.search(r'(<footer[^>]*>.*?<div[^>]*class=["\'][^"\']*(?:f-links|links)[^"\']*["\'][^>]*>)(.*?)(</div>)', text, re.I | re.S)
                  if m:
                      text = text[:m.start(2)] + m.group(2) + additions + text[m.start(3):]
                      page.write_text(text, encoding='utf-8')

          # Keep sitemap authoritative for the two guides.
          sitemap = root / 'sitemap.xml'
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              for url, priority in [
                  ('https://legacyarchitectrva.com/what-happens-when-you-die','0.85'),
                  ('https://legacyarchitectrva.com/digital-life-after-death','0.85'),
              ]:
                  if url not in text:
                      text = text.replace('</urlset>', f'  <url><loc>{url}</loc><priority>{priority}</priority></url>\n</urlset>')
              sitemap.write_text(text, encoding='utf-8')

          # Add an explicit Exit Menu control to the mobile navigation.
          text = index.read_text(encoding='utf-8')
          if 'id="mExit"' not in text:
              anchor = '      <a class="m-cta" href="/readiness">Readiness Check</a>\n'
              button = '      <button class="m-exit" id="mExit" type="button" aria-label="Exit menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Exit Menu</span></button>\n'
              if anchor in text:
                  text = text.replace(anchor, anchor + button, 1)

          exit_css = ' .m-exit{display:flex;align-items:center;justify-content:center;gap:9px;margin:18px auto 0;min-height:48px;padding:12px 24px;border:1px solid rgba(212,182,97,.42);border-radius:3px;background:rgba(212,182,97,.06);color:var(--gold);font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;opacity:0;transform:translateY(12px);transition:opacity .4s .34s,transform .4s .34s,background .2s,border-color .2s}.m-menu.on .m-exit{opacity:1;transform:none}.m-exit:hover{background:rgba(212,182,97,.14);border-color:rgba(212,182,97,.7)}.m-exit:focus-visible{outline:2px solid var(--gold-b);outline-offset:3px}.m-exit svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}'
          if '.m-exit{' not in text:
              text = text.replace('</style>', exit_css + '</style>', 1)

          js_anchor = "  burger.addEventListener('click',function(){ setOpen(!menu.classList.contains('on')); });\n"
          js_add = "  var exit=document.getElementById('mExit'); if(exit) exit.addEventListener('click',function(){ setOpen(false); });\n"
          if "getElementById('mExit')" not in text:
              text = text.replace(js_anchor, js_anchor + js_add, 1)

          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy-site-REPO-READY
          if git diff --cached --quiet; then
            echo 'No content changes needed.'
          else
            git commit -m 'fix: add explicit exit control to mobile navigation'
            git push
          fi
