name: Fix founder section text width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the narrow founder text constraint
        shell: python
        run: |
          from pathlib import Path
          p = Path('legacy-site-REPO-READY/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Founder full-width text correction */'
          if marker not in s:
              css = '''\n/* Founder full-width text correction */\n#founder .founder{width:100% !important;max-width:none !important;margin-left:0 !important;margin-right:0 !important}\n#founder .founder p{width:100% !important;max-width:none !important}\n@media(max-width:760px){#founder .founder p{width:100% !important;max-width:none !important}}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-site-REPO-READY/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove narrow founder text width"
          git push
