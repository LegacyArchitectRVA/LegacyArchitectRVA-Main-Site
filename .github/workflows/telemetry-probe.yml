name: Telemetry API Probe

on:
  push:
    paths:
      - '.github/workflows/telemetry-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Supabase telemetry endpoints accept the configured public API key
        env:
          SUPABASE_URL: https://xeqmivqvtumsifwkxpcm.supabase.co
        run: |
          set -euo pipefail
          SUPABASE_KEY=$(sed -n "s/.*SUPABASE_KEY = '\([^']*\)'.*/\1/p" legacy-site-REPO-READY/assets/readiness-telemetry.js | head -1)
          test -n "$SUPABASE_KEY"
          for table in readiness_sessions readiness_events elara_conversations elara_messages; do
            status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
              -X POST "$SUPABASE_URL/rest/v1/$table" \
              -H "apikey: $SUPABASE_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              --data '{}')
            echo "$table -> HTTP $status"
            cat /tmp/response.json
            echo
            case "$status" in
              400|422) ;;
              *) echo "Unexpected authorization/API status for $table: $status"; exit 1 ;;
            esac
          done
