name: Main Site Optimization

on:
  push:
    branches: [main]
    paths:
      - 'legacy-site-REPO-READY/**'
      - '.github/workflows/site-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-site-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pinned HTML optimizer
        run: npm install --no-save --no-package-lock html-minifier-terser@7.2.0

      - name: Minify inline CSS safely
        shell: bash
        run: |
          set -euo pipefail
          for f in legacy-site-REPO-READY/*.html; do
            ./node_modules/.bin/html-minifier-terser "$f" -o "$f.tmp" --minify-css
            mv "$f.tmp" "$f"
          done

      - name: Harden client-side scripts and audit assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          root=Path('legacy-site-REPO-READY'); pages=sorted(root.glob('*.html'))

          ELARA_SITE_CONTEXT = """CURRENT LEGACY ARCHITECT RVA WEBSITE FACTS — AUTHORITATIVE
Brand: Legacy Architect RVA. Founder: Craig Rothchild. Richmond, Virginia. Phone: (804) 866-1320. Email: info@legacyarchitectrva.com. Tagline: Order in Your Absence.
Core service: Life Manual. It is the practical operational layer alongside legal estate documents. A will or trust addresses legal ownership/distribution; the Life Manual explains how life actually operates so a successor can step in and run it. This is facilitation and continuity planning, not legal, financial, tax, investment, or medical advice.
Current offerings: Just-In-Case Plan $29, a 26-page fillable PDF workbook delivered automatically by email after checkout; it is DIY, not a finished Life Manual, and answers stay on the customer's device. Blueprint Session $249, one live working session that maps where the client stands and produces a practical 72-hour plan; the $249 credits toward a full Life Manual if the client proceeds; it is NOT a Life Manual. Personal Life Manual $1,500, covering 7 of 8 chapters: Introduction, Digital Life, Emergency & Successor Access, Financial & Assets, Household Operations, Vital Records, Legacy & Wishes. Business Life Manual $2,500, everything in Personal plus Business Continuity, covering all 8 chapters. Full Life Manual editions are built over structured working sessions with live draft review in the Client Portal. Pay in full or start with a 50% deposit; balance due on delivery.
The 7 Pillars of Continuity, in current website order: 1) Digital Life, 2) Emergency & Successor Access, 3) Financial & Assets, 4) Household Operations, 5) Vital Records, 6) Legacy & Wishes, 7) Business Continuity. Do NOT substitute the older pillar list.
Process: sign; Secure Drive established before session one; session one begins Digital Life; subsequent sessions build chapters and verify systems; final session includes successor walkthrough; 72 hours for corrections; material is then removed from the portal under the Zero-Knowledge Protocol; Annual Review keeps the manual current.
Privacy: clients control their information; Legacy Architect RVA does not retain passwords, credentials, or private client files after the applicable delivery/purge process. Never ask users for passwords, authentication codes, or other secrets.
Free resources: Readiness Check is free, approximately two minutes, no email required, and identifies gaps across the seven pillars. The Handoff is a free one-page tool covering who to call first, what keeps running, and where the keys live, and it does not ask for passwords.
Scheduling: use https://cal.com/legacyarchitectrva/discovery-call. The obsolete private-conversation calendar URL must never be used.
JIC landing page: https://jicplan.legacyarchitectrva.com/. Current Stripe payment link: https://buy.stripe.com/aFafZhavZcCIe7qbI96Zy01.
Elara is the website assistant. Answer from these current facts and the public website, not historical prompts or cached information. Do not invent services, prices, editions, claims, credentials, storage practices, or features. If asked for legal, financial, tax, investment, or medical advice, provide only general information and recommend a qualified professional."""
          context_json=json.dumps(ELARA_SITE_CONTEXT, ensure_ascii=False)

          def add_decoding(text):
              out=[]; pos=0
              while True:
                  start=text.lower().find('<img',pos)
                  if start<0: out.append(text[pos:]); break
                  end=text.find('>',start)
                  if end<0: out.append(text[pos:]); break
                  tag=text[start:end+1]; out.append(text[pos:start]); low=tag.lower()
                  if 'decoding=' not in low and 'fetchpriority="high"' not in low and "fetchpriority='high'" not in low:
                      tag=tag[:-1]+' decoding="async">'
                  out.append(tag); pos=end+1
              return ''.join(out)

          telemetry_canonical = {
              'readiness-telemetry.js': '<script data-cfasync="false" src="/assets/readiness-telemetry.js" defer></script>',
              'elara-telemetry.js': '<script data-cfasync="false" src="/assets/elara-telemetry.js" defer></script>',
          }
          for page in pages:
              text=page.read_text(encoding='utf-8')
              text=add_decoding(text)
              text=re.sub(r'<script\b(?![^>]*\bsrc\s*=)[^>]*>\s*</script>', '', text, flags=re.I|re.S)
              text=text.replace("function askAI(q){\n  think(function(){});           /* show the thinking state immediately */\n  orb.classList.add('think');", "function askAI(q){\n  orb.classList.add('think');")
              text=text.replace(".then(function(r){ return r.json(); })", ".then(function(r){\n    if(!r.ok) throw new Error('worker-http-'+r.status);\n    return r.json();\n  })")
              context_block='<script data-cfasync="false">window.__LA_ELARA_SITE_CONTEXT__='+context_json+';</script>'
              context_pattern=re.compile(r'<script data-cfasync="false">window\.__LA_ELARA_SITE_CONTEXT__=.*?</script>', re.I|re.S)
              text=context_pattern.sub('', text)
              if 'var WORKER =' in text:
                  text=text.replace('var WORKER =', context_block+'\nvar ELARA_SITE_CONTEXT = window.__LA_ELARA_SITE_CONTEXT__ || "";\nvar WORKER =', 1)
              text=text.replace(
                  'body:JSON.stringify({question:q, history:convo.slice(-6)})',
                  'body:JSON.stringify({question:q+"\\n\\nCURRENT WEBSITE FACTS (authoritative):\\n"+ELARA_SITE_CONTEXT, history:convo.slice(-6)})'
              )
              for asset_name, canonical in telemetry_canonical.items():
                  tag_pattern = re.compile(
                      r'<script\b[^>]*\bsrc=["\']/assets/' + re.escape(asset_name) +
                      r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I|re.S
                  )
                  text, replaced = tag_pattern.subn(canonical, text)
                  if replaced == 0 and page.name == 'readiness.html' and asset_name == 'readiness-telemetry.js':
                      text=text.replace('</head>', canonical+'\n</head>', 1)
                  if replaced == 0 and asset_name == 'elara-telemetry.js' and '/assets/elara-telemetry.js' not in text:
                      text=text.replace('</head>', canonical+'\n</head>', 1)
              page.write_text(text,encoding='utf-8',newline='')

          for asset_name in ('readiness-telemetry.js','elara-telemetry.js'):
              asset=root/'assets'/asset_name
              digest=hashlib.sha256(asset.read_bytes()).hexdigest()[:12]
              pattern=re.compile(r'(/assets/'+re.escape(asset_name)+r')(?:\?[^"\']*)?')
              for page in pages:
                  text=page.read_text(encoding='utf-8')
                  text=pattern.sub(r'\1?v='+digest, text)
                  page.write_text(text,encoding='utf-8',newline='')

          sources=[]
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html','.css','.js','.txt','.xml','.json','.md'}:
                  if p.name == 'SITE_ASSET_AUDIT.md': continue
                  sources.append(p.read_text(encoding='utf-8',errors='ignore'))
          corpus='\n'.join(sources); assets=root/'assets'; candidates=[]
          if assets.exists():
              for p in assets.iterdir():
                  if p.is_file() and p.name not in corpus: candidates.append((p.name,p.stat().st_size))
          report=root/'SITE_ASSET_AUDIT.md'
          lines=['# Site asset audit','','Generated by the main-site optimization workflow.','','## Potentially unreferenced assets','','Candidates from a conservative repository-wide reference scan.','']
          lines += [f'- `{name}` ({size:,} bytes)' for name,size in sorted(candidates)] or ['- None detected.']
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          verified_unused={'pillar-business-v2.webp','pillar-digital-v2.webp','pillar-emergency-v2.webp','pillar-financial-v2.webp','pillar-household-v2.webp','pillar-legacy-v2.webp','pillar-vital-v2.webp'}
          candidate_names={name for name,_ in candidates}
          for name in verified_unused & candidate_names:
              p=assets/name
              if p.exists(): p.unlink()
          for p in list(assets.iterdir()) if assets.exists() else []:
              if not p.is_file(): continue
              if p.suffix.lower() in {'.bak','.tmp'} or p.name=='.DS_Store' or p.name.endswith('~'):
                  p.unlink(); continue
              if p.suffix.lower()=='.jpg' and p.with_suffix('.webp').exists() and p.name not in corpus:
                  p.unlink()
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in legacy-site-REPO-READY/assets/*.js; do
            node --check "$f"
          done

      - name: Regenerate CSP from current HTML
        working-directory: legacy-site-REPO-READY
        run: python3 gen_csp.py

      - name: Validate site structure, CSP, and client hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('legacy-site-REPO-READY'); errors=[]
          headers=(root/'_headers').read_text(encoding='utf-8')
          inline_empty_script=re.compile(r'<script\b(?![^>]*\bsrc\s*=)[^>]*>\s*</script>', re.I|re.S)
          telemetry_tags={
              'readiness.html': re.compile(r'<script\s+data-cfasync="false"\s+src="/assets/readiness-telemetry\.js\?v=[0-9a-f]{12}"\s+defer(?:="defer")?>', re.I),
              'elara': re.compile(r'<script\s+data-cfasync="false"\s+src="/assets/elara-telemetry\.js\?v=[0-9a-f]{12}"\s+defer(?:="defer")?>', re.I),
          }
          if "script-src 'self' 'unsafe-inline'" in headers: errors.append('_headers: script-src still permits unsafe-inline')
          if "script-src-attr 'unsafe-inline'" in headers: errors.append('_headers: script-src-attr still permits unsafe-inline')
          if 'script-src-attr' not in headers: errors.append('_headers: missing script-src-attr policy')
          readiness=root/'readiness.html'
          if readiness.exists() and not telemetry_tags['readiness.html'].search(readiness.read_text(encoding='utf-8')):
              errors.append('readiness.html: readiness telemetry tag missing, unversioned, or Rocket Loader attribute order is wrong')
          for page in sorted(root.glob('*.html')):
              text=page.read_text(encoding='utf-8'); low=text.lower()
              if not telemetry_tags['elara'].search(text): errors.append(f'{page}: Elara telemetry tag missing, unversioned, or Rocket Loader attribute order is wrong')
              if 'var ELARA_SITE_CONTEXT' not in text: errors.append(f'{page}: missing current Elara website context')
              if 'CURRENT WEBSITE FACTS (authoritative)' not in text: errors.append(f'{page}: missing authoritative Elara context payload')
              if low.count('<h1') != 1: errors.append(f'{page}: expected exactly one H1')
              if inline_empty_script.search(text): errors.append(f'{page}: empty inline script block')
              ids=re.findall(r'id=[\"\']([^\"\']+)[\"\']',text,re.I); seen=set()
              for x in ids:
                  if x in seen: errors.append(f'{page}: duplicate id {x}')
                  seen.add(x)
              for marker in ('href="','href=\'','src="','src=\''):
                  pos=0
                  while True:
                      i=text.find(marker,pos)
                      if i<0: break
                      q=marker[-1]; j=text.find(q,i+len(marker))
                      if j<0: break
                      ref=text[i+len(marker):j]
                      if any(ch in ref for ch in '+$[]{}') or ref.startswith(('#','/','http:','https:','mailto:','tel:','data:','javascript:')):
                          pos=j+1; continue
                      target=(page.parent/ref.split('?',1)[0].split('#',1)[0]).resolve()
                      if not target.exists(): errors.append(f'{page}: missing local reference {ref}')
                      pos=j+1
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print(f'Validated {len(list(root.glob("*.html")))} HTML pages: PASS')
          PY

      - name: Commit optimization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'No optimization changes to commit.'; exit 0; fi
          git add legacy-site-REPO-READY
          git commit -m 'security: version telemetry assets to defeat stale CDN cache'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
