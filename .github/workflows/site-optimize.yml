name: Main Site Optimization

on:
  push:
    branches: [main]
    paths:
      - 'legacy-site-REPO-READY/**'
      - '.github/workflows/site-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-site-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pinned HTML optimizer
        run: npm install --no-save --no-package-lock html-minifier-terser@7.2.0

      - name: Minify inline CSS safely
        shell: bash
        run: |
          set -euo pipefail
          for f in legacy-site-REPO-READY/*.html; do
            ./node_modules/.bin/html-minifier-terser "$f" -o "$f.tmp" --minify-css
            mv "$f.tmp" "$f"
          done

      - name: Add async image decoding and audit assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          root=Path('legacy-site-REPO-READY'); pages=sorted(root.glob('*.html'))
          def add_decoding(text):
              out=[]; pos=0
              while True:
                  start=text.lower().find('<img',pos)
                  if start<0: out.append(text[pos:]); break
                  end=text.find('>',start)
                  if end<0: out.append(text[pos:]); break
                  tag=text[start:end+1]; out.append(text[pos:start]); low=tag.lower()
                  if 'decoding=' not in low and 'fetchpriority="high"' not in low and "fetchpriority='high'" not in low:
                      tag=tag[:-1]+' decoding="async">'
                  out.append(tag); pos=end+1
              return ''.join(out)
          for page in pages:
              page.write_text(add_decoding(page.read_text(encoding='utf-8')),encoding='utf-8',newline='')
          sources=[]
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html','.css','.js','.txt','.xml','.json','.md'}:
                  sources.append(p.read_text(encoding='utf-8',errors='ignore'))
          corpus='\n'.join(sources); assets=root/'assets'; candidates=[]
          if assets.exists():
              for p in assets.iterdir():
                  if p.is_file() and p.name not in corpus: candidates.append((p.name,p.stat().st_size))
          report=root/'SITE_ASSET_AUDIT.md'
          lines=['# Site asset audit','','Generated by the main-site optimization workflow.','','## Potentially unreferenced assets','','Candidates from a conservative repository-wide reference scan. Ordinary assets are not auto-deleted unless they are provably unused raster fallbacks.','']
          lines += [f'- `{name}` ({size:,} bytes)' for name,size in sorted(candidates)] or ['- None detected.']
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          for p in list(assets.iterdir()) if assets.exists() else []:
              if not p.is_file(): continue
              if p.suffix.lower() in {'.bak','.tmp'} or p.name=='.DS_Store' or p.name.endswith('~'):
                  p.unlink(); continue
              if p.suffix.lower()=='.jpg' and p.with_suffix('.webp').exists() and p.name not in corpus:
                  p.unlink()
          PY

      - name: Validate site structure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('legacy-site-REPO-READY'); errors=[]
          for page in sorted(root.glob('*.html')):
              text=page.read_text(encoding='utf-8')
              if text.lower().count('<h1') != 1: errors.append(f'{page}: expected exactly one H1')
              ids=re.findall(r'id=[\"\']([^\"\']+)[\"\']',text,re.I); seen=set()
              for x in ids:
                  if x in seen: errors.append(f'{page}: duplicate id {x}')
                  seen.add(x)
              for marker in ('href="','href=\'','src="','src=\''):
                  pos=0
                  while True:
                      i=text.find(marker,pos)
                      if i<0: break
                      q=marker[-1]; j=text.find(q,i+len(marker))
                      if j<0: break
                      ref=text[i+len(marker):j]
                      if any(ch in ref for ch in '+$[]{}') or ref.startswith(('#','/','http:','https:','mailto:','tel:','data:','javascript:')):
                          pos=j+1; continue
                      target=(page.parent/ref.split('?',1)[0].split('#',1)[0]).resolve()
                      if not target.exists(): errors.append(f'{page}: missing local reference {ref}')
                      pos=j+1
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print(f'Validated {len(list(root.glob("*.html")))} HTML pages: PASS')
          PY

      - name: Commit optimization changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'No optimization changes to commit.'; exit 0; fi
          git add legacy-site-REPO-READY
          git commit -m 'perf: optimize main site markup and assets'
          git push
