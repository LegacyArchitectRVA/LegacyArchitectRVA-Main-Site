name: Add continuity section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-continuity-section.yml'
      - 'legacy-site-REPO-READY/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add continuity section before Let Your Legacy Echo
        shell: python
        run: |
          from pathlib import Path
          path = Path('legacy-site-REPO-READY/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'Let your Legacy echo'
          if 'WHAT CONTINUITY REALLY MEANS' in text:
              print('Continuity section already present')
              raise SystemExit(0)
          pos = text.find(marker)
          if pos == -1:
              raise SystemExit('Could not find Let your Legacy echo marker')
          start = text.rfind('<section', 0, pos)
          if start == -1:
              raise SystemExit('Could not find containing section')
          section = '''<section class="band continuity-emotional" aria-labelledby="continuity-heading">
            <div class="wrap" style="text-align:center">
              <div class="eyebrow">What continuity really means</div>
              <h2 id="continuity-heading" class="lead center reveal">When you're gone, they still have to wake up tomorrow.</h2>
              <p class="body center reveal">The world doesn't stop because someone is missing.</p>
              <p class="body center reveal">Morning still comes. The lights still need to be turned on. The phone still rings. Someone still has to know what to do.</p>
              <p class="body center reveal">And for the people who love you, there will already be enough to carry.</p>
              <p class="body center reveal">Continuity is the quiet assurance that, even in the middle of something they never wanted to face, <strong>they won't have to figure out how to live your life while they're learning how to live without you.</strong></p>
              <p class="body center reveal">It means the things you've built, the people you cared for, and the life you spent years putting together don't disappear into confusion when you can no longer be the one holding it all together.</p>
              <p class="body center reveal"><strong>Because your absence should never erase the path you spent a lifetime creating.</strong></p>
            </div>
          </section>
          '''
          text = text[:start] + section + text[start:]
          path.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-site-REPO-READY/index.html
          git diff --cached --quiet || git commit -m "Add emotional continuity section to homepage"
          git push
